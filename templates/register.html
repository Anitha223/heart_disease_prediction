<!doctype html>
<html class="no-js" lang="zxx">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Register | Heart Risk AI</title>
    
    <link rel="icon" href="assets/img/favicon.png">
    
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.min.css">
    <link rel="stylesheet" href="assets/css/icofont.css">
    <link rel="stylesheet" href="assets/css/animate.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="stylesheet" href="assets/premium_styles.css?v=2.2">
</head>
<body>

    <!-- Header Area -->
    <header class="header_section">
        <div class="header_top" style="background:#0f172a;">
            <div class="container-fluid">
                <div class="contact_link-container">
                    <a href="#" class="contact_link1 text-white">
                        <h1 style="color:white;">Heart Disease Identification System</h1>
                    </a>
                </div>
            </div>
        </div>
        <br>
        <div class="header_bottom" id="header_bottom">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-lg custom_nav-container">
                    <a class="navbar-brand" href="/">
                        <span>
                            <h1 style="color:var(--primary); font-weight: 800;">Risk Analysis AI</h1>
                        </span>
                    </a>
                    <button class="navbar-toggler" type="button" data-toggle="collapse"
                        data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                        aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>

                    <div class="collapse navbar-collapse ml-auto" id="navbarSupportedContent">
                        <ul class="navbar-nav ml-auto">
                            <li class="nav-item">
                                <a class="nav-link" href="/">Home </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="userLoginForm">User Login</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="adminLoginForm">Admin Login</a>
                            </li>
                            <li class="nav-item active">
                                <a class="nav-link" href="userRegisterForm">Register</a>
                            </li>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </header>

    <!-- Registration Section -->
    <section class="prediction-container d-flex align-items-center" style="min-height: 90vh;">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="form-white-card">
                        <div class="text-center mb-4">
                            <div class="icon-box-premium mb-3 d-inline-block" style="font-size: 2.5rem; color:var(--primary); background: #f0fdf4; padding: 15px; border-radius: 50%;">
                                <i class="icofont-ui-user"></i>
                            </div>
                            <h2 style="font-weight: 800; color: #0f172a;">Create Your Account</h2>
                            <p class="text-muted">Register to access the predictive healthcare system</p>
                        </div>

                        <form action="userRegister" method="post">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label font-weight-bold">Full Name</label>
                                    <input type="text" class="form-control-premium" id="name" name="name" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="login-id" class="form-label font-weight-bold">Login ID</label>
                                    <input type="text" class="form-control-premium" id="login-id" name="loginid" required>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="email" class="form-label font-weight-bold">Email Address</label>
                                    <input type="email" class="form-control-premium" id="email" name="email" required>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="password" class="form-label font-weight-bold">Password</label>
                                    <input type="password" class="form-control-premium" id="password" name="password" required>
                                </div>
                                <div class="col-md-12 mb-3">
                                    <label for="mobile" class="form-label font-weight-bold">Mobile Number</label>
                                    <input type="tel" class="form-control-premium" id="mobile" name="mobile" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="locality" class="form-label font-weight-bold">Locality / City</label>
                                    <input type="text" class="form-control-premium" id="locality" name="locality" required>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label for="state" class="form-label font-weight-bold">State / Region</label>
                                    <input type="text" class="form-control-premium" id="state" name="state" required>
                                </div>
                            </div>

                            <button type="submit" class="btn-primary-new w-100 justify-content-center">
                                Complete Registration <i class="icofont-rounded-right ml-2"></i>
                            </button>
                            
                            <div class="text-center mt-4">
                                <p class="text-muted">Already have an account? <a href="userLoginForm" style="color:var(--primary); font-weight: 600;">Sign in here</a></p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Area -->
    <footer class="footer_area" style="background:#0f172a; padding:40px 0; color:white;">
        <div class="container text-center">
            <p style="color:#94a3b8; margin:0;">© 2026 Heart Risk AI System | Secure Medical Registration</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="assets/js/jquery-3.3.1.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>
</body>
</html>
